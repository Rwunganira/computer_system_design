site_name: Computer System Design, in Python
site_description: A hands-on companion to Saltzer and Kaashoek's Principles of Computer System Design, with runnable Python and Flask examples from public health.
site_url: https://rwunganira.github.io/computer_system_design/
repo_url: https://github.com/Rwunganira/computer_system_design
repo_name: computer_system_design
edit_uri: ""
docs_dir: site_src
site_dir: site

theme:
  name: material
  language: en
  font:
    text: Source Sans 3
    code: JetBrains Mono
  icon:
    logo: material/heart-pulse
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra_css:
  - assets/course.css

nav:
  - Home: index.md
  - Course outline: outline.md
  - Glossary: glossary.md
  - Modules:
      - Setup: lessons/00_setup.md
      - 1. Complexity: lessons/01_complexity.md
      - 2. Elements: lessons/02_elements.md
      - 3. Naming: lessons/03_naming.md
      - 4. Clients and services: lessons/04_client_service.md
      - 5. Virtualization: lessons/05_virtualization.md
      - 6. Performance: lessons/06_performance.md
      - 7. Networks: lessons/07_networks.md
      - 8. Fault tolerance: lessons/08_fault_tolerance.md
      - 9. Atomicity: lessons/09_atomicity.md
      - 10. Consistency: lessons/10_consistency.md
      - 11. Security: lessons/11_security.md
      - Capstone: lessons/12_capstone.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - abbr
  - pymdownx.snippets:
      base_path: [site_includes]
      auto_append: [glossary_tooltips.md]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: Course material for learning. All data is synthetic.
