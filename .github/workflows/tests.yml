name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solutions:
    # The exercises are meant to fail until a learner completes them, so CI
    # checks that every module's tests pass against its worked solutions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install -e .
      - name: Tests against solutions
        run: COURSE_SOLUTIONS=1 pytest
      - name: Examples run end to end
        run: python scripts/run_examples.py
